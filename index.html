<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uberbora apps</title>
<style>
  :root { --bg:#f5f7fa; --fg:#17212b; --muted:#4c5a68; --ink:#1b4b73; --line:#d8dfe7; --surface:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1418; --fg:#e3e8ee; --muted:#a5b2bf; --ink:#9ccbf5; --line:#2a3540; --surface:#161d24; color-scheme:dark; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.6 "Segoe UI", system-ui, sans-serif; }
  main { max-width:40rem; margin:0 auto; padding:56px 20px; }
  h1 { font-size:36px; margin:0 0 8px; }
  h2 { font-size:22px; margin:0 0 2px; }
  .app { border-top:1px solid var(--line); padding-top:20px; margin-top:20px; }
  .app p { margin-bottom:12px; }
  p { color:var(--muted); margin:0 0 24px; }
  a.btn { display:inline-block; padding:12px 18px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink); text-decoration:none; font-weight:600; margin:0 8px 8px 0; }
</style>
</head>
<body>
<main>
  <h1>uberbora</h1>
  <p>Apps and their privacy policies · Uygulamalar ve gizlilik politikaları</p>
  <section class="app">
    <h2>UbiReader</h2>
    <p>Business card reader · Kartvizit okuyucu</p>
    <a class="btn" href="ubireader/privacy/">Privacy Policy · Gizlilik Politikası</a>
  </section>
  <section class="app">
    <h2>UbiChef</h2>
    <p>Meal planner · Yemek planlayıcı</p>
    <a class="btn" href="ubichef/privacy/">Privacy Policy · Gizlilik Politikası</a>
  </section>
  <!-- APPS -->
</main>
</body>
</html>
