<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>UbiChef</title>
<meta property="og:title" content="UbiChef'te bir tarif">
<meta property="og:description" content="Bir arkadaşın sana UbiChef'ten bir tarif gönderdi. / A friend sent you a recipe from UbiChef.">
<link rel="icon" href="../../assets/uberbora.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="../../assets/site.css">
<style>
  /* Opens the shared recipe in the UbiChef app. On purpose, this page never shows the recipe itself. */
  .handoff { max-width: 26rem; margin: 0 auto; padding: clamp(40px, 9vw, 88px) 0; text-align: center; }
  .handoff > svg { width: 88px; height: 88px; margin: 0 auto 22px; }
  .handoff h1 { font-size: clamp(30px, 7vw, 40px); margin-bottom: 10px; }
  .handoff p { color: var(--muted); }
  .handoff .btn { display: flex; justify-content: center; width: 100%; margin-top: 12px; }
  .handoff small { display: block; margin-top: 24px; color: var(--muted); font-size: 15px; }
</style>
</head>
<body>
<header class="on-sun">
  <div class="wrap topbar"><a class="brand" href="../../"><svg viewBox="0 0 32 32" shape-rendering="crispEdges" aria-hidden="true"><rect width="32" height="32" fill="#E1C02C"/><path d="M6 6h5v1h-5zM21 6h5v1h-5zM5 7h7v14h-7zM20 7h7v14h-7zM5 21h8v1h-8zM19 21h8v1h-8zM5 22h9v1h-9zM18 22h9v1h-9zM5 23h22v3h-22zM6 26h20v1h-20zM7 27h18v1h-18zM8 28h16v1h-16z"/></svg>uberbora</a></div>
</header>
<main class="wrap handoff">
  <svg viewBox="0 0 108 108" aria-hidden="true">
    <rect width="108" height="108" rx="24" fill="#a8283a"/>
    <circle cx="54" cy="54" r="27" fill="none" stroke="#fff" stroke-width="3.6"/>
    <circle cx="43.5" cy="47" r="6.4" fill="#fff"/><circle cx="62.5" cy="46" r="4.8" fill="#fff"/><circle cx="56" cy="62.5" r="5.6" fill="#fff"/>
  </svg>
  <h1 id="h">Sana bir tarif gönderildi</h1>
  <p id="p">Tarifi görmek için UbiChef'te aç.</p>
  <a class="btn sun px" id="open" href="#">UbiChef'te aç</a>
  <a class="btn quiet" id="get" href="https://play.google.com/store/apps/details?id=com.uberbora.ubichef">Google Play'den indir</a>
  <small id="s">UbiChef şimdilik yalnızca Android'de.</small>
</main>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var id = q.get('id'), m = q.get('m');
    var ok = /^[A-Za-z0-9_]{1,40}$/;
    var path = id && ok.test(id) ? 'recipe/' + id : m && ok.test(m) ? 'meal/' + m : '';
    var play = 'https://play.google.com/store/apps/details?id=com.uberbora.ubichef';
    var en = !/^tr\b/i.test(navigator.language || '');
    if (en) {
      document.documentElement.lang = 'en';
      document.getElementById('h').textContent = 'Someone sent you a recipe';
      document.getElementById('p').textContent = 'Open it in UbiChef to see it.';
      document.getElementById('open').textContent = 'Open in UbiChef';
      document.getElementById('get').textContent = 'Get it on Google Play';
      document.getElementById('s').textContent = 'UbiChef is on Android for now.';
    }
    var openBtn = document.getElementById('open');
    if (!path) { openBtn.style.display = 'none'; return; }
    var android = /Android/i.test(navigator.userAgent);
    if (!android) { openBtn.style.display = 'none'; return; }
    // Android: open the app at the recipe; Chrome falls back to the Play Store when UbiChef isn't installed.
    var intent = 'intent://' + path + '#Intent;scheme=ubichef;package=com.uberbora.ubichef;S.browser_fallback_url=' + encodeURIComponent(play) + ';end';
    openBtn.href = intent;
    location.replace(intent);
  })();
</script>
</body>
</html>
